<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>[시안] 표·차트 조작 기능</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #172033; --muted: #667085; --line: #d1d5db; --canvas: #f3f4f6;
    --surface: #ffffff; --soft: #f8fafc; --blue: #3b82f6; --blue-dark: #1e40af;
    --blue-soft: #eff6ff; --danger: #b42318; --danger-bg: #fef3f2;
    font-family: "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: var(--canvas); color: var(--ink); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .page-sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .demo-block { max-width: 720px; margin: 0 auto 40px; }
  .demo-block h2 { font-size: 13px; color: var(--muted); font-weight: 700; margin: 0 0 8px; }

  .table-wrap, .chart-wrap { margin-top: 14px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .table-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .table-meta-label { flex: 1 1 auto; min-width: 120px; }
  .table-controls { display: flex; align-items: center; gap: 8px; }
  .table-controls select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; color: var(--ink); background: #fff; }
  .csv-button, .chart-save-button { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 700; color: var(--blue-dark); background: #fff; cursor: pointer; }
  .csv-button:hover, .chart-save-button:hover { background: var(--blue-soft); border-color: #bfdbfe; }

  .data-table { width: 100%; min-width: max-content; border-collapse: collapse; font-size: 12px; }
  .data-table th, .data-table td { padding: 9px 10px; border-bottom: 1px solid #eef1f5; text-align: left; white-space: nowrap; }
  .data-table th { color: #475467; background: #f8fafc; font-weight: 700; }
  .data-table .numeric { text-align: right; font-variant-numeric: tabular-nums; }
  .data-table th.sortable { cursor: pointer; user-select: none; }
  .data-table th.sortable:hover { color: var(--blue-dark); background: #eef2ff; }
  .sort-arrow { display: inline-block; margin-left: 4px; opacity: .4; font-size: 10px; }
  .sort-arrow.is-active { opacity: 1; color: var(--blue); }

  .period-summary { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--muted); font-size: 12px; }
  .period-summary strong { color: var(--ink); }
  .period-summary .delta-up { color: #166534; font-weight: 700; }
  .period-summary .delta-down { color: #b42318; font-weight: 700; }
  .period-summary.is-empty { display: none; }

  .chart-wrap { height: 320px; padding: 12px; position: relative; }
  .chart-wrap-header { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .chart-canvas-box { height: 250px; }

  .note { max-width: 720px; margin: 0 auto 28px; padding: 10px 14px; border-radius: 8px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>

<div style="max-width:720px;margin:0 auto 20px;">
  <h1>표·차트 조작 기능 시안</h1>
  <p class="page-sub">정렬 · 상위 N개 · CSV 다운로드 · 차트 이미지 저장 · 기간 대비 요약</p>
</div>

<div class="note">
  아래 두 예시는 실제 사용 시나리오를 그대로 보여줍니다.
  <strong>표 1</strong>은 월별 매출처럼 기간 컬럼이 인식되는 경우(전월·전년 대비까지 표시),
  <strong>표 2</strong>는 제품명처럼 기간이 아닌 카테고리 데이터라 최고/최저만 표시되고
  전월·전년 대비 문구는 자동으로 숨겨지는 경우입니다.
</div>

<div class="demo-block">
  <h2>표 1 — 월별 매출 (기간 컬럼 인식됨)</h2>
  <div id="table-1"></div>
</div>

<div class="demo-block">
  <h2>표 2 — 제품별 구매금액 (기간 컬럼 없음)</h2>
  <div id="table-2"></div>
</div>

<script>
  // ------------------------------------------------------------
  // 더미 TableData (실제로는 ChatResponse.tables[i] 형태)
  // ------------------------------------------------------------
  const TABLE_1 = {
    domain: 'sales', sql: 'SELECT month, revenue FROM sales_summary ...',
    columns: ['월', '매출'],
    rows: [
      ['2024-01', 32000000], ['2024-02', 28500000], ['2024-03', 41200000],
      ['2024-04', 39800000], ['2024-05', 45600000], ['2024-06', 43100000],
      ['2023-06', 38000000],
    ],
    chartable: true, chart_type: 'bar', label_column: '월', value_column: '매출',
  };
  const TABLE_2 = {
    domain: 'purchase', sql: 'SELECT product_name, amount FROM purchase_summary ...',
    columns: ['제품명', '구매금액'],
    rows: [
      ['원자재A', 12500000], ['원자재B', 8300000], ['부자재C', 4100000],
      ['원자재D', 19800000], ['소모품E', 950000],
    ],
    chartable: true, chart_type: 'bar', label_column: '제품명', value_column: '구매금액',
  };

  // ------------------------------------------------------------
  // 기간 컬럼 인식 (컬럼명 + 값 형식 패턴 추측, 실패하면 null)
  // ------------------------------------------------------------
  const PERIOD_NAME_PATTERN = /(월|년|기간|date|month|year|period)/i;

  function parsePeriod(value) {
    const s = String(value ?? '').trim();
    let m = s.match(/^(\d{4})[-/](\d{1,2})(?:[-/]\d{1,2})?$/); // 2024-03, 2024/03, 2024-03-15
    if (m) return { year: +m[1], month: +m[2] };
    m = s.match(/^(\d{4})년\s*(\d{1,2})월$/); // 2024년 3월
    if (m) return { year: +m[1], month: +m[2] };
    m = s.match(/^(\d{4})년?$/); // 2024, 2024년
    if (m) return { year: +m[1], month: null };
    return null;
  }

  function detectPeriodColumnIndex(columns) {
    const idx = columns.findIndex(c => PERIOD_NAME_PATTERN.test(c));
    return idx;
  }

  function formatMoney(n) {
    return (n / 10000).toLocaleString(undefined, { maximumFractionDigits: 0 }) + '만';
  }

  function computeSummary(columns, rows, valueColumn) {
    const valueIdx = columns.indexOf(valueColumn);
    if (valueIdx < 0 || !rows.length) return null;
    const labelIdx = 0;
    let maxRow = rows[0], minRow = rows[0];
    for (const row of rows) {
      if (Number(row[valueIdx]) > Number(maxRow[valueIdx])) maxRow = row;
      if (Number(row[valueIdx]) < Number(minRow[valueIdx])) minRow = row;
    }
    const summary = {
      max: { label: maxRow[labelIdx], value: maxRow[valueIdx] },
      min: { label: minRow[labelIdx], value: minRow[valueIdx] },
      mom: null, yoy: null,
    };

    const periodIdx = detectPeriodColumnIndex(columns);
    if (periodIdx < 0) return summary; // 기간 컬럼 없음 -> 최고/최저만

    const parsed = rows
      .map(row => ({ period: parsePeriod(row[periodIdx]), value: Number(row[valueIdx]), row }))
      .filter(p => p.period && p.period.month != null && Number.isFinite(p.value));
    if (parsed.length < 2) return summary; // 파싱 실패 -> 최고/최저만

    parsed.sort((a, b) => (a.period.year - b.period.year) || (a.period.month - b.period.month));
    const latest = parsed[parsed.length - 1];

    const prevMonth = parsed.find(p =>
      (p.period.year === latest.period.year && p.period.month === latest.period.month - 1) ||
      (latest.period.month === 1 && p.period.year === latest.period.year - 1 && p.period.month === 12));
    if (prevMonth && prevMonth.value !== 0) {
      summary.mom = { pct: ((latest.value - prevMonth.value) / Math.abs(prevMonth.value)) * 100, from: prevMonth, to: latest };
    }

    const prevYear = parsed.find(p => p.period.year === latest.period.year - 1 && p.period.month === latest.period.month);
    if (prevYear && prevYear.value !== 0) {
      summary.yoy = { pct: ((latest.value - prevYear.value) / Math.abs(prevYear.value)) * 100, from: prevYear, to: latest };
    }

    return summary;
  }

  function deltaSpan(pct) {
    const cls = pct >= 0 ? 'delta-up' : 'delta-down';
    const arrow = pct >= 0 ? '▲' : '▼';
    return `<span class="${cls}">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
  }

  function summaryHtml(summary) {
    if (!summary) return '';
    const parts = [];
    parts.push(`최고 <strong>${escapeHtml(summary.max.label)}</strong> (${formatMoney(summary.max.value)})`);
    parts.push(`최저 <strong>${escapeHtml(summary.min.label)}</strong> (${formatMoney(summary.min.value)})`);
    if (summary.mom) parts.push(`전월 대비 ${deltaSpan(summary.mom.pct)}`);
    if (summary.yoy) parts.push(`전년 동월 대비 ${deltaSpan(summary.yoy.pct)}`);
    return parts.map(p => `<span>${p}</span>`).join('');
  }

  // ------------------------------------------------------------
  // CSV 다운로드 (화면에 보이는 현재 상태 그대로)
  // ------------------------------------------------------------
  function csvEscape(value) {
    const s = String(value ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function downloadCsv(columns, rows, fileNameBase) {
    const lines = [columns.map(csvEscape).join(',')];
    rows.forEach(row => lines.push(row.map(csvEscape).join(',')));
    const csv = '﻿' + lines.join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${fileNameBase}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  // ------------------------------------------------------------
  // 표+차트 블록 (정렬/상위N 상태를 가진다)
  // ------------------------------------------------------------
  function mountTableBlock(container, table, idPrefix) {
    const state = { sortCol: -1, sortDir: 0, topN: 'all' };
    let chartInstance = null;

    function currentRows() {
      let rows = table.rows.slice();
      if (state.sortCol >= 0 && state.sortDir !== 0) {
        rows.sort((a, b) => {
          const av = a[state.sortCol], bv = b[state.sortCol];
          const cmp = typeof av === 'number' && typeof bv === 'number'
            ? av - bv
            : String(av).localeCompare(String(bv));
          return state.sortDir === 1 ? cmp : -cmp;
        });
      }
      if (state.topN !== 'all') rows = rows.slice(0, Number(state.topN));
      return rows;
    }

    function render() {
      const rows = currentRows();
      const headerHtml = table.columns.map((col, i) => {
        const active = state.sortCol === i && state.sortDir !== 0;
        const arrow = active ? (state.sortDir === 1 ? '▲' : '▼') : '▲▼';
        return `<th class="sortable" data-col="${i}">${escapeHtml(col)}<span class="sort-arrow${active ? ' is-active' : ''}">${arrow}</span></th>`;
      }).join('');
      const rowsHtml = rows.map(row => `<tr>${row.map((cell, i) => `<td${typeof cell === 'number' ? ' class="numeric"' : ''}>${escapeHtml(typeof cell === 'number' ? cell.toLocaleString() : cell)}</td>`).join('')}</tr>`).join('');

      const summary = table.value_column ? computeSummary(table.columns, rows, table.value_column) : null;

      container.innerHTML = `
        <div class="table-wrap">
          <div class="table-meta">
            <span class="table-meta-label">${escapeHtml(table.domain)} 데이터 · ${rows.length}건${rows.length !== table.rows.length ? ` (전체 ${table.rows.length}건 중)` : ''}</span>
            <div class="table-controls">
              <select class="topn-select">
                <option value="all">전체 보기</option>
                <option value="5">상위 5개</option>
                <option value="10">상위 10개</option>
              </select>
              <button type="button" class="csv-button">⭳ CSV 다운로드</button>
            </div>
          </div>
          <table class="data-table"><thead><tr>${headerHtml}</tr></thead><tbody>${rowsHtml}</tbody></table>
        </div>
        <div class="period-summary${summary ? '' : ' is-empty'}">${summaryHtml(summary)}</div>
        ${table.chartable ? `
        <div class="chart-wrap">
          <div class="chart-wrap-header"><button type="button" class="chart-save-button">🖼 이미지 저장</button></div>
          <div class="chart-canvas-box"><canvas id="${idPrefix}-canvas"></canvas></div>
        </div>` : ''}
      `;

      container.querySelector('.topn-select').value = state.topN;
      container.querySelectorAll('th.sortable').forEach(th => {
        th.addEventListener('click', () => {
          const col = Number(th.dataset.col);
          if (state.sortCol !== col) { state.sortCol = col; state.sortDir = 1; }
          else if (state.sortDir === 1) state.sortDir = -1;
          else if (state.sortDir === -1) { state.sortCol = -1; state.sortDir = 0; }
          else state.sortDir = 1;
          render();
        });
      });
      container.querySelector('.topn-select').addEventListener('change', e => {
        state.topN = e.target.value;
        render();
      });
      container.querySelector('.csv-button').addEventListener('click', () => {
        downloadCsv(table.columns, currentRows(), `${table.domain}_${idPrefix}`);
      });

      if (table.chartable) {
        const labelIdx = table.columns.indexOf(table.label_column);
        const valueIdx = table.columns.indexOf(table.value_column);
        const canvas = container.querySelector(`#${idPrefix}-canvas`);
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(canvas, {
          type: table.chart_type || 'bar',
          data: {
            labels: rows.map(r => String(r[labelIdx])),
            datasets: [{ label: table.value_column, data: rows.map(r => Number(r[valueIdx]) || 0), backgroundColor: '#2563eb', borderRadius: 5 }],
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
        });
        container.querySelector('.chart-save-button').addEventListener('click', () => {
          const a = document.createElement('a');
          a.href = chartInstance.toBase64Image();
          a.download = `${table.domain}_${idPrefix}_chart.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        });
      }
    }

    render();
  }

  mountTableBlock(document.getElementById('table-1'), TABLE_1, 't1');
  mountTableBlock(document.getElementById('table-2'), TABLE_2, 't2');
</script>
</body>
</html>
