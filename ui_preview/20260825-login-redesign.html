<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>[시안] 로그인 화면 리디자인</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  시안 전용: Google Fonts CDN을 씁니다. 실제 이식 시에는 CLAUDE.md의
  "외부 CDN 금지" 규칙에 따라 Noto Sans KR을 self-host 해야 합니다.
  (django_app/web/static/web/fonts/ 에 woff2 저장 + @font-face 로컬 참조)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 기존 style.css 토큰 그대로 가져옴 */
    --ink: #172033;
    --muted: #667085;
    --line: #d1d5db;
    --canvas: #f3f4f6;
    --surface: #ffffff;
    --blue: #3b82f6;
    --blue-dark: #1e40af;
    --blue-soft: #eff6ff;
    --danger: #b42318;
    --danger-bg: #fef3f2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; }
  body {
    font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    color: var(--ink);
  }

  /* 실제 첨부 도시 야경 사진. ui_preview/assets/city-bg-2400.jpg
     (원본 StockSnap_QQXLXMX04M.jpg, 6000x3937 23.8MB를 2400px/78%로
     리사이즈·압축한 미리보기용 사본. 이식 시 별도 최적화 필요) */
  .login-screen {
    position: relative;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 1.25rem;
    overflow: hidden;
    background: #10192e url('assets/city-bg-2400.jpg') center 38% / cover no-repeat;
  }
  .login-screen::before {
    /* 사진 위 어두운 오버레이. 카드 대비와 가독성 확보용 */
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8,14,28,.25) 0%, rgba(8,14,28,.55) 100%);
  }

  /* 중앙 blur 카드 (glassmorphism) — 두 번째 첨부(산 배경 로그인) 참고 */
  .login-card {
    position: relative;
    z-index: 2;
    width: min(100%, 23rem);
    padding: 2.25rem 2rem 2rem;
    display: grid;
    gap: .85rem;
    border-radius: 1.1rem;
    border: 1px solid rgba(255,255,255,.28);
    background: rgba(20, 28, 46, .38);
    backdrop-filter: blur(9px) saturate(140%);
    -webkit-backdrop-filter: blur(9px) saturate(140%);
    box-shadow: 0 24px 60px rgba(4, 10, 26, .45), inset 0 1px 0 rgba(255,255,255,.12);
    color: #fff;
  }
  .login-card h1 {
    margin: 0 0 .15rem;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .login-card .sub {
    margin: 0 0 .5rem;
    color: rgba(255,255,255,.72);
    font-size: .85rem;
  }
  .field { display: grid; gap: .35rem; }
  .field label {
    font-size: .78rem;
    font-weight: 500;
    color: rgba(255,255,255,.85);
  }
  .field input {
    min-height: 2.75rem;
    border-radius: .6rem;
    border: 1px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.1);
    padding: .55rem .8rem;
    color: #fff;
    font: inherit;
    font-size: .92rem;
  }
  .field input::placeholder { color: rgba(255,255,255,.5); }
  .field input:focus-visible {
    outline: 2px solid #7ab8ff;
    outline-offset: 1px;
    background: rgba(255,255,255,.16);
  }
  .login-error {
    min-height: 1.1rem;
    margin: 0;
    font-size: .82rem;
    color: #ffd7d2;
  }

  .submit-btn {
    min-height: 2.85rem;
    border: 0; border-radius: .65rem;
    background: linear-gradient(135deg, #3b82f6, #1e40af);
    color: #fff; font-weight: 700; font-size: .95rem;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(30, 64, 175, .45);
  }
  .submit-btn:hover { filter: brightness(1.06); }
  .submit-btn:disabled { opacity: .6; cursor: progress; }

  /* 상태 전환 데모 컨트롤 (시안 전용 UI, 실 화면에는 없음) */
  .demo-bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px;
    max-width: calc(100vw - 24px);
    background: rgba(10,14,26,.7); backdrop-filter: blur(8px);
    border-radius: .6rem; border: 1px solid rgba(255,255,255,.15);
  }
  .demo-bar button {
    font: inherit; font-size: .74rem; padding: .4rem .65rem;
    border-radius: .4rem; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06); color: #fff; cursor: pointer;
  }
  .demo-bar button.active { background: #3b82f6; border-color: #3b82f6; }
  .demo-note {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    z-index: 10; color: rgba(255,255,255,.55); font-size: .72rem; text-align: center;
    max-width: 90%;
  }

  @media (max-width: 480px) {
    .login-card { padding: 1.9rem 1.5rem 1.7rem; }
  }
</style>
</head>
<body>

<div class="demo-bar" role="group" aria-label="시안 상태 전환 (실 화면에는 없음)">
  <button type="button" data-state="default" class="active">기본</button>
  <button type="button" data-state="loading">로딩</button>
  <button type="button" data-state="error">오류</button>
</div>

<section class="login-screen">
  <form class="login-card" id="login-form" aria-labelledby="login-title">
    <h1 id="login-title">사내 지식 챗봇 로그인</h1>
    <p class="sub">승인된 계정으로 로그인하세요.</p>

    <div class="field">
      <label for="username">로그인 ID</label>
      <input id="username" name="username" autocomplete="username" placeholder="아이디 입력" required maxlength="128">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required maxlength="256">
    </div>

    <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>

    <button id="login-button" class="submit-btn" type="submit">로그인</button>
  </form>
</section>

<script>
  // 상태 데모 전환
  const form = document.getElementById('login-form');
  const btn = document.getElementById('login-button');
  const err = document.getElementById('login-error');
  const buttons = document.querySelectorAll('.demo-bar button');
  buttons.forEach(b => b.addEventListener('click', () => {
    buttons.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const state = b.dataset.state;
    if (state === 'default') {
      btn.disabled = false; btn.textContent = '로그인'; err.textContent = '';
    } else if (state === 'loading') {
      btn.disabled = true; btn.textContent = '로그인 중…'; err.textContent = '';
    } else if (state === 'error') {
      btn.disabled = false; btn.textContent = '로그인';
      err.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
    }
  }));

  form.addEventListener('submit', e => e.preventDefault());
</script>
</body>
</html>
