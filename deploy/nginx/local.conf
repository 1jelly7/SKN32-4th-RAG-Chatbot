# 프로젝트 루트를 nginx prefix(-p)로 지정해 실행하는 로컬 개발용 origin gateway 설정이다.
# 브라우저에는 127.0.0.1:8000만 공개하고 두 애플리케이션은 upstream으로 분리한다.

worker_processes 1;
pid temp/nginx-local.pid;
error_log logs/nginx-local-error.log warn;

events {
    worker_connections 256;
}

http {
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    access_log logs/nginx-local-access.log;

    types {
        text/html html htm;
        text/css css;
        text/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }

    upstream django_local {
        server 127.0.0.1:8001;
    }

    upstream fastapi_local {
        server 127.0.0.1:8002;
    }

    server {
        listen 127.0.0.1:8000;
        server_name localhost 127.0.0.1;

        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;

        # 클라이언트가 주입한 forwarded header를 upstream 신뢰 정보로 전달하지 않는다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /internal/auth {
            return 404;
        }

        location ^~ /internal/auth/ {
            return 404;
        }

        location = /api/chat {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://fastapi_local;
        }

        location ^~ /api/chat/ {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://fastapi_local;
        }

        location = /api/documents {
            proxy_buffering off;
            proxy_pass http://fastapi_local;
        }

        location ^~ /api/documents/ {
            proxy_buffering off;
            proxy_pass http://fastapi_local;
        }

        location = /api/health {
            proxy_pass http://fastapi_local;
        }

        location = /docs {
            proxy_pass http://fastapi_local;
        }

        location = /openapi.json {
            proxy_pass http://fastapi_local;
        }

        location = /api/auth {
            proxy_pass http://django_local;
        }

        location ^~ /api/auth/ {
            proxy_pass http://django_local;
        }

        # 알려지지 않은 API가 Django HTML page route로 fallback하지 않게 한다.
        location ^~ /api/ {
            return 404;
        }

        location = /django-static {
            return 308 /django-static/;
        }

        location ^~ /django-static/ {
            alias staticfiles/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://django_local;
        }
    }
}
