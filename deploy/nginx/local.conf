# 프로젝트 루트를 nginx prefix(-p)로 지정해 실행하는 로컬 개발용 origin gateway 설정이다.
# 브라우저에는 127.0.0.1:8000만 공개하고 두 애플리케이션은 upstream으로 분리한다.

worker_processes 1;
pid temp/nginx-local.pid;
error_log logs/nginx-local-error.log warn;

events {
    worker_connections 256;
}

http {
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    access_log logs/nginx-local-access.log;

    types {
        text/html html htm;
        text/css css;
        text/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }

    upstream django_local {
        server 127.0.0.1:8001;
    }

    upstream fastapi_local {
        server 127.0.0.1:8002;
    }

    server {
        listen 127.0.0.1:8000;
        server_name localhost 127.0.0.1;

        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;

        # 클라이언트가 주입한 forwarded header를 upstream 신뢰 정보로 전달하지 않는다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /internal/auth {
            return 404;
        }

        location ^~ /internal/auth/ {
            return 404;
        }

        location = /api/chat {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://fastapi_local;
        }

        location ^~ /api/chat/ {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://fastapi_local;
        }

        location = /api/documents {
            proxy_buffering off;
            proxy_pass http://fastapi_local;
        }

        location ^~ /api/documents/ {
            proxy_buffering off;
            proxy_pass http://fastapi_local;
        }

        # 추가: 리포트(.docx) 생성 API(app/api/reports.py)를 FastAPI로 보낸다.
        # /api/documents와 동일하게 파일을 바로 스트리밍하므로 proxy_buffering을 끈다.
        # 이걸 안 넣으면 108행 아래 catch-all(location ^~ /api/ { return 404; })에
        # 걸려 FastAPI까지 요청이 가지도 못하고 nginx가 바로 404를 돌려준다.
        location = /api/reports {
            proxy_buffering off;
            proxy_pass http://fastapi_local;
        }

        location ^~ /api/reports/ {
            proxy_buffering off;
            proxy_pass http://fastapi_local;
        }

        # TEMP: 이상탐지 임시 대시보드 API(app/api/anomalies.py). /api/reports와
        # 마찬가지로 여기 등록 안 하면 108행 아래 catch-all에 걸려 FastAPI까지
        # 요청이 가지도 못하고 nginx가 바로 404를 돌려준다. 다른 팀원이 실제
        # 대시보드를 완성하면 이 location 블록도 함께 지운다.
        location = /api/anomalies {
            proxy_pass http://fastapi_local;
        }

        location = /api/dashboard {
            proxy_pass http://fastapi_local;
        }

        location ^~ /api/dashboard/ {
            proxy_pass http://fastapi_local;
        }

        location = /api/health {
            proxy_pass http://fastapi_local;
        }

        location = /docs {
            proxy_pass http://fastapi_local;
        }

        location = /openapi.json {
            proxy_pass http://fastapi_local;
        }

        location = /api/auth {
            proxy_pass http://django_local;
        }

        location ^~ /api/auth/ {
            proxy_pass http://django_local;
        }

        # 알려지지 않은 API가 Django HTML page route로 fallback하지 않게 한다.
        location ^~ /api/ {
            return 404;
        }

        location = /django-static {
            return 308 /django-static/;
        }

        location ^~ /django-static/ {
            alias staticfiles/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://django_local;
        }
    }
}
